name: Report rendering

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions: read-all

jobs:
  render:
    runs-on: ubuntu-latest
    env:
      RQUALIFY_RENDER_SMOKE: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-tinytex@v2
      - uses: quarto-dev/quarto-actions/setup@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: local::.
      - name: Install report fonts and LaTeX packages
        shell: Rscript {0}
        run: tinytex::tlmgr_install(c("stmaryrd", "booktabs", "fancyhdr", "caption", "footmisc", "listings", "grfext"))
      - name: Install current package for Quarto subprocesses
        run: R CMD INSTALL .
      - name: Render both report formats with failure fixtures
        shell: Rscript {0}
        run: testthat::test_local(filter = "render-smoke")
